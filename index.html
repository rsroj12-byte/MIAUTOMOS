const cat=t=>`<div class="chat"><div class="bub"><b>Mandarino:</b> ${t}</div><div class="av"><canvas width="18" height="18" data-c="${cm}"></canvas></div></div>`;
const hud=()=>{const l=L[li];return `<div class="hud"><span>Nivel ${li+1}/${L.length}: ${l.e} ${l.n}</span><span>${"❤️".repeat(lives)}${"🖤".repeat(3-lives)}</span></div><div class="prog"><i style="width:${qi/l.q.length*100}%"></i></div>`};
const scene=m=>{cm=mood(m);if(m=="w"&&li==3)cm="a";return `<div class="scene"><canvas width="160" height="90" data-m="${m}"></canvas></div>`};
const adult=`<div class="warn">⚠️ Estas actividades se hacen con supervisión de un adulto responsable. El juego es solo educativo.</div>`;
function title(){
 app.innerHTML=`${scene("t")}<div class="card"><h1 class="logo">MIAUTOMOS</h1><p class="sub">Lu y Mandarino: Química en el campamento</p>
 <p>Lu es una exploradora y Mandarino, un gato naranja muy sabio, le indica qué hacer. Ayúdala a usar la química en situaciones reales: fogata, picaduras, cocina, jabón y pan.</p>
 <p class="mut"><b>Cómo se juega:</b> escribe fórmulas con el teclado, clasifica y balancea ecuaciones. Tienes 3 ❤️ por nivel; pierdes una al fallar. Si se acaban, repites el nivel. Atajos: <b>Enter</b> confirma, <b>1-3</b> elige opción, <b>Espacio</b> sopla. Al escribir fórmulas usa números normales: H2O, CO2. Respeta mayúsculas y minúsculas (NaCl).</p>
 <button id="go">¡Empezar! (Enter)</button>${adult}</div>`;
 $("#go").onclick=()=>{li=0;intro()};
}
function intro(){
 qi=0;lives=3;locked=false;const l=L[li];
 app.innerHTML=`${scene("n")}<div class="card">${hud()}${cat(l.intro)}${l.adult?adult:""}<button id="go">Entendido (Enter)</button></div>`;
 $("#go").onclick=ask;
}
function ask(){
 locked=false;clearInterval(tm);const q=L[li].q[qi];let b="";
 if(q.t=="choice")b=q.o.map((o,i)=>`<button class="o" data-i="${i}">${i+1}. ${o}</button>`).join("");
 else if(q.t=="blow")b=`<div class="bar"><i id="bar"></i></div><div class="mut" id="clock"></div><button id="blow">💨 Soplar</button>`;
 else b=(q.eq?`<div class="eq">${q.eq}</div>`:"")+`<input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.t=="bal"?"Un número por sustancia":q.t=="seq"?"Una letra por sustancia":"Tu fórmula"}"><button id="go">Responder (Enter)</button>`;
 app.innerHTML=`${scene("q")}<div class="card">${hud()}${cat(`<span class="mut">Pregunta ${qi+1} de ${L[li].q.length}</span><br>${q.p}`)}<div style="margin-top:10px">${b}</div></div>`;
 if(q.t=="choice")document.querySelectorAll(".o").forEach(x=>x.onclick=()=>fin(+x.dataset.i==q.a));
 else if(q.t=="blow"){
  bv=0;let t=8;const push=()=>{if(locked)return;bv+=7;$("#bar").style.width=Math.min(bv,100)+"%";if(bv>=100)fin(true)};
  $("#blow").onclick=push;window.blowFn=push;
  tm=setInterval(()=>{if(locked)return;t-=.1;bv=Math.max(0,bv-1.6);$("#bar").style.width=bv+"%";$("#clock").textContent="Tiempo: "+Math.max(t,0).toFixed(1)+" s";if(t<=0)fin(false)},100);
 }else{
  const i=$("#in");i.focus();
  $("#go").onclick=()=>{const v=i.value;let ok=false;
   if(q.t=="text")ok=v.replace(/\s/g,"").replace(/[₀-₉]/g,c=>"₀₁₂₃₄₅₆₇₈₉".indexOf(c))==q.a;
   else if(q.t=="seq")ok=v.toUpperCase().replace(/[^A-Z]/g,"")==q.a;
   else ok=(v.match(/\d+/g)||[]).join(",")==q.a;
   fin(ok)};
 }
}
function fin(ok){
 if(locked)return;locked=true;clearInterval(tm);window.blowFn=null;
 if(!ok)lives--;const q=L[li].q[qi],dead=lives<=0;
 app.innerHTML=`${scene(ok?"h":"s")}<div class="card">${hud()}<p class="${ok?"ok":"bad"}">${ok?"✅ ¡Correcto!":"❌ No era esa."}</p>${cat(q.x)}<button id="go">${dead?"Ver resultado":"Continuar"} (Enter)</button></div>`;
 $("#go").onclick=()=>{if(dead)return lose();qi++;qi>=L[li].q.length?win():ask()};
}
function lose(){
 app.innerHTML=`${scene("s")}<div class="card"><h1>Te quedaste sin vidas</h1>${cat("¡Ánimo, Lu! Repasemos la explicación y volvamos a intentarlo. Equivocarse también enseña.")}<button id="go">Repetir nivel (Enter)</button></div>`;
 $("#go").onclick=intro;
}
function win(){
 lives=3;const last=li==L.length-1;
 app.innerHTML=`${scene("w")}<div class="card"><h1>${last?"¡Campamento completado!":"¡Nivel superado!"}</h1>${cat(last?"¡Lo lograste! Ahora sabes que la química está en la fogata, la cocina, el jabón y el pan. Mira a tu alrededor: ¡está en todas partes!":"¡Bien hecho! Tus vidas se renovaron: ❤️❤️❤️. Vamos al siguiente reto.")}<button id="go">${last?"Jugar de nuevo":"Siguiente nivel"} (Enter)</button></div>`;
 $("#go").onclick=()=>{if(last)title();else{li++;intro()}};
}
document.addEventListener("keydown",e=>{
 if(e.code=="Space"&&window.blowFn){e.preventDefault();window.blowFn();return}
 if(e.key=="Enter"){const g=$("#go");if(g){e.preventDefault();g.click()}return}
 if(/^[1-4]$/.test(e.key)&&document.activeElement.tagName!="INPUT"){const o=document.querySelectorAll(".o")[+e.key-1];if(o)o.click()}
});
new MutationObserver(paint).observe(app,{childList:true});
title();
